[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scitt-selective-disclosure"
version = "0.1.0"
description = "Selective-disclosure bug-report evidence workflow built on SCITT"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Microsoft Corporation" }]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "black>=24,<26",
  "flake8>=7,<8",
  "isort>=5,<7",
  "mypy>=1.8,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "templates/*.html"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
known_first_party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

# The C++ extension module ships no stubs; its surface is documented in
# bindings/python_module.cpp.
[[tool.mypy.overrides]]
module = ["_native"]
ignore_missing_imports = true
