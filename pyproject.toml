[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scitt-selective-disclosure"
version = "0.1.0"
description = "Selective-disclosure bug-report evidence workflow built on SCITT"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Microsoft Corporation" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "black>=24,<26",
  "flake8>=7,<8",
  "isort>=5,<7",
  "mypy>=1.8,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitt_selective_disclosure = [
  "static/css/*.css",
  "static/js/*.js",
  "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
known_first_party = ["scitt_selective_disclosure"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["scitt_selective_disclosure"]

[tool.coverage.report]
fail_under = 85
show_missing = true
