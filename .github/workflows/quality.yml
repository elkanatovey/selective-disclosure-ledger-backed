name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system checks
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 shellcheck
      - name: Install packages
        run: pip install -e ".[dev]"
      - name: Run checks
        run: scripts/checks.sh

  cddl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install CDDL
        run: gem install cddl
      - name: Validate schemas
        run: scripts/validate_cddl.sh
