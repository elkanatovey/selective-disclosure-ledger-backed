name: real-scitt-demo

on:
  pull_request:
    paths:
      - "cli/**"
      - "core/**"
      - "demo/**"
      - "src/**"
      - "tests/web/**"
      - "third_party/scitt-ccf-ledger"
      - "CMakeLists.txt"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - ".github/workflows/demo.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install demo
        run: pip install -e ".[dev]"
      - name: Run real SCITT smoke test
        run: demo/run.sh --smoke
